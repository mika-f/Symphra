[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mika-f/Symphra"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
annotate-snippets = "0.12.16"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"

symphra-syntax = { path = "crates/symphra-syntax" }
symphra-fmt = { path = "crates/symphra-fmt" }
symphra-compiler = { path = "crates/symphra-compiler" }
symphra-score = { path = "crates/symphra-score" }
symphra-render = { path = "crates/symphra-render" }
symphra-export = { path = "crates/symphra-export" }
symphra-dsp = { path = "crates/symphra-dsp" }
symphra-sampler = { path = "crates/symphra-sampler" }
symphra-soundfont = { path = "crates/symphra-soundfont" }
symphra-vst3 = { path = "crates/symphra-vst3" }
symphra-engine = { path = "crates/symphra-engine" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
